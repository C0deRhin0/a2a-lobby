services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_lobby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: agent_lobby
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_lobby -d agent_lobby"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["npm", "run", "migrate", "-w", "@agent-lobby/server"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agent_lobby:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agent_lobby
      REDIS_URL: redis://redis:6379
      A2A_PUBLIC_BASE_URL: ${A2A_PUBLIC_BASE_URL:?set A2A_PUBLIC_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://agent_lobby:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agent_lobby
      REDIS_URL: redis://redis:6379
      A2A_PUBLIC_BASE_URL: ${A2A_PUBLIC_BASE_URL:?set A2A_PUBLIC_BASE_URL}
      METRICS_HOST: 127.0.0.1
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Expose the app only to a host-side or external reverse proxy.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

volumes:
  postgres_data:
  redis_data:

networks:
  private:
    driver: bridge
